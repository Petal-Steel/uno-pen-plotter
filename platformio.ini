[platformio]
default_envs = uno
src_dir = grbl

[env:uno]
platform = platformio/atmelavr@5.1.0
board = uno
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L
; GRBL supplies main() and all peripheral initialization. No Arduino framework.
build_src_filter = +<*.c> -<examples/>
build_flags =
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -lm
monitor_speed = 115200
